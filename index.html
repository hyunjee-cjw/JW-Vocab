<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지우 단어장</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1.5rem 1rem; }
.wrap { max-width: 560px; margin: 0 auto; }
.header { margin-bottom: 2rem; }
.app-title { font-size: 26px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; }
.app-sub { font-size: 14px; color: #888; }
.unit-card { background: white; border-radius: 14px; padding: 1.2rem 1.5rem; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: 1.5px solid #eee; transition: border-color 0.15s; }
.unit-card:hover { border-color: #1D9E75; }
.unit-name { font-size: 16px; font-weight: 600; color: #1a1a1a; }
.unit-topic { font-size: 13px; color: #888; margin-top: 2px; }
.unit-arrow { color: #ccc; font-size: 18px; }
.empty { text-align: center; padding: 3rem; color: #bbb; font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="app-title">📚 지우 단어장</div>
    <div class="app-sub">Multiple Reading Skills E</div>
  </div>
  <div id="unit-list"></div>
</div>
<script>
const units = [
  { id: "unit85", name: "Unit 85", topic: "Coal (석탄)", file: "unit85.html" }
];

const container = document.getElementById('unit-list');
if (units.length === 0) {
  container.innerHTML = '<div class="empty">아직 등록된 단원이 없어요.</div>';
} else {
  units.forEach(u => {
    const card = document.createElement('div');
    card.className = 'unit-card';
    card.innerHTML = `<div><div class="unit-name">${u.name}</div><div class="unit-topic">${u.topic}</div></div><div class="unit-arrow">›</div>`;
    card.onclick = () => location.href = u.file;
    container.appendChild(card);
  });
}
</script>
</body>
</html>
