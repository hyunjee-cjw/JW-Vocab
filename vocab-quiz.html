<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 퀴즈</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .wrap { width: 100%; max-width: 500px; }
  .header { margin-bottom: 1.5rem; }
  .unit-label { font-size: 13px; color: #888; margin-bottom: 4px; }
  .title { font-size: 22px; font-weight: 600; color: #1a1a1a; }
  .progress-bar { width: 100%; height: 5px; background: #e0e0d8; border-radius: 3px; margin: 1rem 0; }
  .progress-fill { height: 5px; background: #1D9E75; border-radius: 3px; transition: width 0.3s; }
  .card { background: white; border-radius: 16px; padding: 2.5rem 1.5rem; text-align: center; margin-bottom: 1rem; min-height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
  .word-en { font-size: 36px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
  .word-hint { font-size: 13px; color: #aaa; }
  .feedback { font-size: 14px; padding: 10px 14px; border-radius: 10px; margin-bottom: 1rem; display: none; text-align: center; }
  .feedback.show { display: block; }
  .feedback.correct { background: #e1f5ee; color: #0F6E56; }
  .feedback.skip { background: #fef3e2; color: #8a5c00; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .input-row input { flex: 1; font-size: 16px; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 10px; background: white; color: #1a1a1a; outline: none; }
  .input-row input:focus { border-color: #1D9E75; }
  .btn { padding: 12px 20px; border-radius: 10px; border: 1.5px solid #ddd; background: white; color: #1a1a1a; font-size: 15px; cursor: pointer; transition: background 0.15s; width: 100%; margin-bottom: 8px; }
  .btn:hover { background: #f5f5f0; }
  .btn-primary { background: #1D9E75; color: white; border-color: #1D9E75; font-weight: 600; }
  .btn-primary:hover { background: #0F6E56; }

  /* 결과 화면 */
  .result-wrap { display: none; }
  .result-card { background: white; border-radius: 16px; padding: 2rem 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.07); margin-bottom: 1rem; }
  .score-big { font-size: 52px; font-weight: 700; color: #1D9E75; text-align: center; margin-bottom: 4px; }
  .score-sub { font-size: 14px; color: #888; text-align: center; margin-bottom: 1.5rem; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 8px 6px; color: #888; border-bottom: 1px solid #eee; font-weight: 500; }
  td { padding: 10px 6px; border-bottom: 1px solid #f0f0f0; color: #1a1a1a; }
  .tag-ok { color: #0F6E56; font-weight: 600; }
  .tag-skip { color: #cc8800; font-weight: 600; }

  @media print {
    body { background: white; }
    .btn, .input-row, .progress-bar, .no-print { display: none !important; }
    .result-card { box-shadow: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="unit-label">Multiple Reading Skills E</div>
    <div class="title" id="quiz-title">Unit 85 — Coal</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <!-- 퀴즈 화면 -->
  <div id="quiz-area">
    <div class="card">
      <div class="word-en" id="word-display"></div>
      <div class="word-hint" id="word-hint"></div>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="input-row">
      <input type="text" id="answer-input" placeholder="뜻을 입력하세요" autocomplete="off" />
      <button class="btn btn-primary" style="width:auto; white-space:nowrap" onclick="submitAnswer()">확인</button>
    </div>
    <button class="btn" onclick="skipWord()">모르겠어요</button>
  </div>

  <!-- 결과 화면 -->
  <div class="result-wrap" id="result-area">
    <div class="result-card">
      <div class="score-big" id="score-text"></div>
      <div class="score-sub" id="score-sub"></div>
      <table>
        <thead><tr><th>단어</th><th>내 답</th><th>정답</th><th></th></tr></thead>
        <tbody id="result-body"></tbody>
      </table>
    </div>
    <button class="btn btn-primary no-print" onclick="window.print()">🖨️ 출력하기</button>
    <button class="btn no-print" style="margin-top:8px" onclick="restart()">다시 풀기</button>
  </div>
</div>

<script>
const UNIT = "Unit 85 — Coal";
const words = [
  {en:"buried",      ko:"묻힌, 파묻힌"},
  {en:"sunshine",    ko:"햇빛, 햇살"},
  {en:"formed",      ko:"형성된, 만들어진"},
  {en:"valuable",    ko:"가치 있는, 귀중한"},
  {en:"fingernail",  ko:"손톱"},
  {en:"polish",      ko:"광택제, 닦다"},
  {en:"aspirin",     ko:"아스피린"},
  {en:"lipsticks",   ko:"립스틱"},
  {en:"plastics",    ko:"플라스틱"},
  {en:"recordings",  ko:"녹음물, 레코드"},
  {en:"purpose",     ko:"목적, 용도"},
  {en:"mined",       ko:"채굴된"},
  {en:"digging",     ko:"파는, 굴착"},
  {en:"surface",     ko:"표면, 지표면"},
  {en:"necessary",   ko:"필요한, 필수적인"}
];

let current = 0, answers = [], shuffled = [];

function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }

function start() {
  shuffled = shuffle(words);
  current = 0; answers = [];
  document.getElementById('quiz-title').textContent = UNIT;
  showWord();
}

function showWord() {
  const w = shuffled[current];
  document.getElementById('word-display').textContent = w.en;
  document.getElementById('word-hint').textContent = (current+1) + ' / ' + shuffled.length;
  document.getElementById('prog').style.width = (current / shuffled.length * 100) + '%';
  document.getElementById('answer-input').value = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('answer-input').focus();
}

function submitAnswer() {
  const val = document.getElementById('answer-input').value.trim();
  if (!val) return;
  const w = shuffled[current];
  answers.push({word: w.en, correct: w.ko, user: val, skipped: false});
  const fb = document.getElementById('feedback');
  fb.textContent = '✓ 정답: ' + w.ko;
  fb.className = 'feedback show correct';
  setTimeout(nextWord, 1000);
}

function skipWord() {
  const w = shuffled[current];
  answers.push({word: w.en, correct: w.ko, user: '', skipped: true});
  const fb = document.getElementById('feedback');
  fb.textContent = '정답: ' + w.ko;
  fb.className = 'feedback show skip';
  setTimeout(nextWord, 1200);
}

function nextWord() {
  current++;
  if (current >= shuffled.length) showResult();
  else showWord();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('prog').style.width = '100%';

  const answered = answers.filter(a => !a.skipped).length;
  const total = answers.length;
  const score = Math.round(answered / total * 100);

  document.getElementById('score-text').textContent = score + '점';
  document.getElementById('score-sub').textContent = '총 ' + total + '개 중 ' + answered + '개 답변 · ' + UNIT;

  const tbody = document.getElementById('result-body');
  tbody.innerHTML = '';
  answers.forEach(a => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong>' + a.word + '</strong></td>' +
      '<td style="color:#666">' + (a.skipped ? '-' : a.user) + '</td>' +
      '<td>' + a.correct + '</td>' +
      '<td>' + (a.skipped ? '<span class="tag-skip">△</span>' : '<span class="tag-ok">✓</span>') + '</td>';
    tbody.appendChild(tr);
  });
}

function restart() {
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  start();
}

document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

start();
</script>
</body>
</html>
