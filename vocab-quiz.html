<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 퀴즈</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1.5rem 1rem; }
.wrap { max-width: 560px; margin: 0 auto; }
.unit-label { font-size: 13px; color: #888; margin-bottom: 4px; }
.title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
.subtitle { font-size: 13px; color: #aaa; margin-bottom: 1rem; }
.word-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid #eee; }
.word-en { font-size: 15px; font-weight: 600; color: #1a1a1a; width: 150px; flex-shrink: 0; padding-top: 8px; }
.word-col { flex: 1; display: flex; flex-direction: column; }
.word-input { font-size: 15px; padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 10px; background: white; color: #1a1a1a; outline: none; width: 100%; }
.word-input:focus { border-color: #1D9E75; }
.word-input.correct { background: #e1f5ee; border-color: #0F6E56; color: #085041; }
.word-input.wrong { background: #fcebeb; border-color: #A32D2D; color: #501313; }
.correct-ans { font-size: 12px; color: #A32D2D; margin-top: 4px; }
.btn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
.btn-primary { background: #1D9E75; color: white; }
.btn-secondary { background: white; color: #555; border: 1.5px solid #ddd; margin-top: 8px; }
.result-box { background: white; border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; display: none; }
.score-big { font-size: 40px; font-weight: 700; color: #1D9E75; }
.score-sub { font-size: 14px; color: #888; margin-top: 4px; }
.loading { text-align: center; padding: 1.5rem; color: #888; font-size: 14px; display: none; }
.wordbook { display: none; margin-top: 1.5rem; }
.wb-title { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 1rem; }
.wb-card { background: white; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 10px; border-left: 4px solid #A32D2D; }
.wb-en { font-size: 18px; font-weight: 700; color: #1a1a1a; }
.wb-pos { font-size: 12px; color: #888; margin-left: 6px; }
.wb-ko { font-size: 15px; color: #333; margin-top: 4px; }
.wb-row { font-size: 13px; color: #666; margin-top: 6px; line-height: 1.6; }
.wb-label { font-weight: 600; color: #555; }
.wb-ex { font-style: italic; color: #444; }
@media print {
  body { background: white; padding: 0; }
  .btn, #quiz-area { display: none !important; }
  .wordbook { display: block !important; }
  .result-box { display: block !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="unit-label">Multiple Reading Skills E</div>
  <div class="title">Unit 85 — Coal</div>
  <div class="subtitle">아는 단어는 뜻을 써보세요. 모르면 빈칸으로 둬도 돼요.</div>

  <div class="result-box" id="result-box">
    <div class="score-big" id="score-big"></div>
    <div class="score-sub" id="score-sub"></div>
  </div>

  <div id="quiz-area">
    <div class="word-row"><div class="word-en">buried</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="묻힌, 파묻힌"></div></div>
    <div class="word-row"><div class="word-en">sunshine</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="햇빛, 햇살"></div></div>
    <div class="word-row"><div class="word-en">formed</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="형성된, 만들어진"></div></div>
    <div class="word-row"><div class="word-en">valuable</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="가치 있는, 귀중한"></div></div>
    <div class="word-row"><div class="word-en">fingernail</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="손톱"></div></div>
    <div class="word-row"><div class="word-en">polish</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="광택제, 닦다"></div></div>
    <div class="word-row"><div class="word-en">aspirin</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="아스피린"></div></div>
    <div class="word-row"><div class="word-en">lipsticks</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="립스틱"></div></div>
    <div class="word-row"><div class="word-en">plastics</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="플라스틱"></div></div>
    <div class="word-row"><div class="word-en">recordings</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="녹음물, 레코드"></div></div>
    <div class="word-row"><div class="word-en">purpose</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="목적, 용도"></div></div>
    <div class="word-row"><div class="word-en">mined</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="채굴된"></div></div>
    <div class="word-row"><div class="word-en">digging</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="파는, 굴착"></div></div>
    <div class="word-row"><div class="word-en">surface</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="표면, 지표면"></div></div>
    <div class="word-row"><div class="word-en">necessary</div><div class="word-col"><input class="word-input" placeholder="한국어 뜻..." data-answer="필요한, 필수적인"></div></div>
  </div>

  <div class="loading" id="loading">✨ AI가 채점 중이에요... 잠깐만요!</div>
  <button class="btn btn-primary" id="main-btn" onclick="grade()">채점하기</button>
  <button class="btn btn-secondary" id="retry-btn" style="display:none" onclick="retry()">다시 풀기</button>
  <button class="btn btn-secondary" id="print-btn" style="display:none" onclick="window.print()">🖨️ 단어장 출력</button>

  <div class="wordbook" id="wordbook">
    <div class="wb-title">📖 틀린 단어장</div>
    <div id="wb-cards"></div>
  </div>
</div>

<script>
const API_KEY = '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';
const CONTEXT = 'Coal is often called buried sunshine. It could also be called buried gold because its many uses make it so valuable. Coal is used to make fingernail polish, aspirin, lipsticks, plastics, and recordings of your favorite singers. It is also used for heating. Today it is still used for this purpose, especially in factories. There are two ways in which most coal is mined. One is by digging deep in the earth and bringing the coal to the surface. Another method is used when the coal is already close to the surface. Then it is only necessary to clear away the earth to reach the coal.';
let wrongWords = [];

async function grade() {
  const inputs = document.querySelectorAll('.word-input');
  const words = [];
  inputs.forEach(inp => words.push({ en: inp.closest('.word-row').querySelector('.word-en').textContent, answer: inp.value.trim(), correct: inp.dataset.answer }));

  document.getElementById('loading').style.display = 'block';
  document.getElementById('main-btn').style.display = 'none';

  const prompt = `다음은 영어 단어와 초등학교 5학년 학생의 한국어 답변입니다. 비슷한 뜻이면 맞은 것으로, 빈칸은 틀린 것으로 처리하세요.
${words.map((w,i) => `${i+1}. ${w.en} - 학생답변: "${w.answer}" (정답예시: ${w.correct})`).join('\n')}
JSON으로만 응답: {"results": [{"en": "단어", "correct": true}]}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const parsed = JSON.parse(data.content[0].text.replace(/```json|```/g, '').trim());
    showResults(parsed.results, words);
  } catch(e) {
    showResults(words.map(w => ({ en: w.en, correct: w.answer !== '' })), words);
  }
  document.getElementById('loading').style.display = 'none';
}

function showResults(results, words) {
  const inputs = document.querySelectorAll('.word-input');
  let correct = 0; wrongWords = [];
  inputs.forEach((inp, i) => {
    inp.disabled = true;
    if (results[i] && results[i].correct) { inp.classList.add('correct'); correct++; }
    else {
      inp.classList.add('wrong');
      const d = document.createElement('div'); d.className = 'correct-ans'; d.textContent = '정답: ' + inp.dataset.answer;
      inp.parentNode.appendChild(d);
      wrongWords.push(words[i].en);
    }
  });
  const wrong = words.length - correct;
  document.getElementById('result-box').style.display = 'block';
  document.getElementById('score-big').textContent = correct + ' / ' + words.length;
  document.getElementById('score-sub').textContent = wrong > 0 ? wrong + '개 틀렸어요.' : '완벽해요! 🎉';
  document.getElementById('retry-btn').style.display = 'block';
  if (wrong > 0) generateWordbook();
}

async function generateWordbook() {
  const prompt = `다음 영어 단어들에 대해 초등학교 5학년 수준의 단어장을 만들어주세요.
지문: "${CONTEXT}"
단어: ${wrongWords.join(', ')}
JSON으로만 응답: {"words": [{"en": "단어", "pos": "품사(한국어)", "ko": "대표뜻 하나만", "synonym": "유의어(없으면 null)", "antonym": "반의어(없으면 null)", "example": "지문 활용 간단한 영어예문"}]}`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1500, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    const parsed = JSON.parse(data.content[0].text.replace(/```json|```/g, '').trim());
    const container = document.getElementById('wb-cards');
    parsed.words.forEach(w => {
      const card = document.createElement('div'); card.className = 'wb-card';
      let html = `<div><span class="wb-en">${w.en}</span><span class="wb-pos">[${w.pos}]</span></div><div class="wb-ko">뜻: ${w.ko}</div>`;
      if (w.synonym) html += `<div class="wb-row"><span class="wb-label">유의어</span>: ${w.synonym}</div>`;
      if (w.antonym) html += `<div class="wb-row"><span class="wb-label">반의어</span>: ${w.antonym}</div>`;
      html += `<div class="wb-row wb-ex">예문: ${w.example}</div>`;
      card.innerHTML = html; container.appendChild(card);
    });
    document.getElementById('wordbook').style.display = 'block';
    document.getElementById('print-btn').style.display = 'block';
  } catch(e) { console.error(e); }
}

function retry() {
  wrongWords = [];
  document.querySelectorAll('.word-input').forEach(inp => {
    inp.value = ''; inp.disabled = false; inp.classList.remove('correct','wrong');
    const a = inp.parentNode.querySelector('.correct-ans'); if(a) a.remove();
  });
  document.getElementById('result-box').style.display = 'none';
  document.getElementById('wordbook').style.display = 'none';
  document.getElementById('wb-cards').innerHTML = '';
  document.getElementById('main-btn').style.display = 'block';
  document.getElementById('retry-btn').style.display = 'none';
  document.getElementById('print-btn').style.display = 'none';
}
</script>
</body>
</html>
